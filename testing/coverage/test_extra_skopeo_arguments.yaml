kind: ImageSync
metadata:
  name: test-extra-skopeo-arguments
  namespace: image-sync-operator
spec:
  source:
    image: "mirror.gcr.io/library/alpine:latest"
  destination:
    image: "registry.registry.svc.cluster.local:5000/library/alpine:test-extra-skopeo-arguments"
  extraSkopeoArguments: "--dest-compress-format zstd"
