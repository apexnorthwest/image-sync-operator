[project]
name = "image-sync-operator-kwok-load"
version = "0.1.0"
description = "KWOK-backed ImageSync operator load harness"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11", "psutil>=6", "pyyaml>=6", "types-psutil", "types-pyyaml"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python = ".venv"
extra-paths = ["."]
