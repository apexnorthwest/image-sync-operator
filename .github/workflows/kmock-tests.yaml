---
name: KMock integration tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        working-directory: tests/kmock
        run: uv sync --locked

      - name: Run full integration suite
        working-directory: tests/kmock
        run: uv run --locked python run_tests.py --slow -j 2
