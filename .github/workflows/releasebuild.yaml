---
name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs: 
  docker-build:
    permissions:
      packages: write
      security-events: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      
      - name: Generate tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          tags: |
            type=semver,pattern={{version}}-${{ matrix.arch }}

      - name: Build Only
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif

  combine-manifests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      
      - name: Generate tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          tags: |
            type=semver,pattern={{version}}

      - name: Combine Manifests
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          echo "$COSIGN_KEY" > cosign.key
          docker manifest create ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }} ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }}-amd64 ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }}-arm64
          cosign sign --key cosign.key ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }}
          rm cosign.key
          docker manifest push ghcr.io/apexnorthwest/image-sync-operator:${{ steps.meta.outputs.tags }}
