---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
type: Opaque
data:
  config.toml: |-
    cluster_scope = {{ if .Values.cluster_scope }}true{{ else }}false{{ end }}
    watched_namespaces = {{ if .Values.watched_namespaces }}{{ toJson .Values.watched_namespaces }}{{ else }}[]{{ end }}
    [skopeo]
    image = "{{ .Values.skopeo.image }}"
    image_pull_policy = "{{ .Values.skopeo.image_pull_policy }}"
    {{ if .Values.skopeo.ca_trust_bundle }}
    ca_trust_bundle = """
{{ .Values.skopeo.ca_trust_bundle | indent 6 }}"""
    {{ end }}
