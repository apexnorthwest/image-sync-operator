[package]
name = "image-sync-operator"
version = "0.1.2"
edition = "2024"

[dependencies]
futures = "0.3"
kube = { version = "4.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube-lease-manager = "0.12"
once_cell = "1.21"
regex = "1.13"
rustls = "0.23"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
yaml_serde = "0.10"

[[bin]]
name = "image-sync-operator"
path = "src/main.rs"
