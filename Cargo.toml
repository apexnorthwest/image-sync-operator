[package]
name = "image-sync-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
kube = { version = "4.0.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
yaml_serde = "0.10.4"
kube-lease-manager = "0.12.0"

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
